<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Box Listening</title>
<style>
:root {
  --bg: #fff8ef; --card: #ffffff; --ink: #241c17; --dim: #6b5d52; --line: #e7dccf;
  --brand: #c2185b; --on-brand: #ffffff; --sq: #f1e7dc; --sq-on: #c2185b; --head: #ffd54f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17141c; --card: #221e29; --ink: #f5f1ff; --dim: #b4aac2; --line: #3a3346;
    --brand: #c2185b; --on-brand: #ffffff; --sq: #2e2838; --sq-on: #ec6a9c; --head: #ffd54f;
  }
}
:root[data-theme="dark"] {
  --bg: #17141c; --card: #221e29; --ink: #f5f1ff; --dim: #b4aac2; --line: #3a3346;
  --brand: #c2185b; --on-brand: #ffffff; --sq: #2e2838; --sq-on: #ec6a9c; --head: #ffd54f;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
#app { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; }
h1 { font-size: 1.45rem; margin: 0 0 8px; }
.lede, .note, .status { color: var(--dim); margin: 0 0 16px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 10px; }
.lab { font-weight: 600; min-width: 110px; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
button { font: inherit; color: var(--ink); background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; min-height: 44px; }
button[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); font-weight: 600; }
button:disabled { opacity: .5; cursor: progress; }
.grid { display: grid; gap: 4px; margin: 16px 0; max-width: 420px; }
.sq { aspect-ratio: 1; border-radius: 6px; background: var(--sq); }
.sq.on { background: var(--sq-on); }
.sq.head { outline: 3px solid var(--head); outline-offset: -3px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 8px 0 16px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.card.picked { border-color: var(--brand); }
.letter { font-size: 2.2rem; font-weight: 800; line-height: 1; }
.play { background: var(--brand); color: var(--on-brand); border-color: var(--brand); font-weight: 700; font-size: 1.1rem; }
.play.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.name { font-weight: 600; }
.num { color: var(--dim); font-size: .85rem; }
.foot { margin: 8px 0; }
</style>
</head>
<body>
<div id="app"></div>
<script src="./lab.js"></script>
</body>
</html>
